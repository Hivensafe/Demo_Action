name: export-single-cache

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: "Cache key"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Restore cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: cache_dir
          key: ${{ inputs.cache_key }}

      - name: 查看缓存内容
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          ls -lah cache_dir || true

      - name: 打包缓存
        run: |
          tar --zstd -cf "${{ inputs.cache_key }}.tar.zst" cache_dir

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-${{ inputs.cache_key }}
          path: "${{ inputs.cache_key }}.tar.zst"