name: export-single-cache

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: 安装工具
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Restore cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ${{ inputs.cache_key }}

      - name: 查看缓存
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          ls -lah ccache || true

      - name: 打包
        run: |
          tar --zstd -cf "${{ inputs.cache_key }}.tar.zst" ccache

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: exported-${{ inputs.cache_key }}
          path: "*.tar.zst"