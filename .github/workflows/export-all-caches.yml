name: export-all-ccache

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}

    steps:
      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: 获取 cache 列表
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth status
          gh api repos/${{ github.repository }}/actions/caches > caches.json

      - name: 生成 matrix
        id: gen
        run: |
          KEYS=$(jq -r '.actions_caches[].key | select(startswith("ccache-"))' caches.json | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix={\"key\":$KEYS}" >> $GITHUB_OUTPUT

  export:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}

    steps:
      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: 设置路径
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_ReSukiSU_6.6.89" >> $GITHUB_ENV

      - name: Restore cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ matrix.key }}

      - name: 检查
        run: |
          echo "key=${{ matrix.key }}"
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          ls -lah "${{ env.CCACHE_DIR }}" || true

      - name: 打包
        run: |
          tar --zstd -cf "${{ matrix.key }}.tar.zst" -C "$HOME" "$(basename $CCACHE_DIR)"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ matrix.key }}
          path: "*.tar.zst"