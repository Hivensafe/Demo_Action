name: export-ccache

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get cache list
        run: |
          curl -s \
          -H "Authorization: Bearer ${{ github.token }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/caches \
          > caches.json

      - name: Generate matrix
        id: set
        run: |
          KEYS=$(jq -r '.actions_caches[].key | select(startswith("ccache-"))' caches.json | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix={\"key\":$KEYS}" >> $GITHUB_OUTPUT

  export:
    needs: list
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}

    steps:
      - name: Restore cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: cache_dir
          key: ${{ matrix.key }}

      - name: Install zstd
        run: sudo apt-get install -y zstd

      - name: Pack cache
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          tar --zstd -cf "${{ matrix.key }}.tar.zst" cache_dir

      - name: Upload artifact
        if: steps.cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: ${{ matrix.key }}.tar.zst